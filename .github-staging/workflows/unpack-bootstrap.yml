name: Unpack bootstrap zip

# Phone-friendly setup: upload mini-commandoes-repo.zip to the repo root via the GitHub web UI,
# then run this workflow. It extracts the project and commits it. (.github/workflows files are NOT
# in the zip: GitHub forbids Actions from writing workflow files, so paste ci.yml yourself.)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          set -euo pipefail
          test -f mini-commandoes-repo.zip || { echo "Upload mini-commandoes-repo.zip to repo root first"; exit 1; }
          unzip -oq mini-commandoes-repo.zip -d .
          rm mini-commandoes-repo.zip
          python3 tools/validate_repo.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack Phase 0 bootstrap (blueprint, data, scaffold)"
          git push
          
